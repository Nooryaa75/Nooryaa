# Configuration Codemagic — builds Android de Nooryaa
# Le projet Android est généré à chaque build : aucun dossier à committer.

workflows:
  # Version de test (APK à installer directement sur un téléphone)
  nooryaa-android:
    name: Nooryaa Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications
      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Configure Firebase (notifications push)
        script: |
          cp google-services.json android/app/google-services.json
          sed -i '' 's|classpath "com.android.tools.build:gradle:.*"|&\n        classpath "com.google.gms:google-services:4.5.0"|' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

  # Version Google Play (AAB signé, à téléverser dans Play Console)
  nooryaa-android-release:
    name: Nooryaa Android (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - nooryaa_keystore
      node: v22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications
      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Configure Firebase (notifications push)
        script: |
          cp google-services.json android/app/google-services.json
          sed -i '' 's|classpath "com.android.tools.build:gradle:.*"|&\n        classpath "com.google.gms:google-services:4.5.0"|' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true
