# Configuration Codemagic — builds Android de Nooryaa
# Le projet Android est généré à chaque build : aucun dossier à committer.

workflows:
  # Version de test (APK à installer directement sur un téléphone)
  nooryaa-android:
    name: Nooryaa Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          # Capacitor 6 imposé : le module de connexion Google native
          # (@codetrix-studio/capacitor-google-auth) n'est compatible qu'avec v6.
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6 @capacitor/app@6 @codetrix-studio/capacitor-google-auth

      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Configure Firebase (notifications push)
        script: |
          cp google-services.json android/app/google-services.json
          sed -i '' 's|classpath "com.android.tools.build:gradle:.*"|&\n        classpath "com.google.gms:google-services:4.5.0"|' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Configure app launcher icon
        script: |
          node scripts/configure-android-icon.mjs
      - name: Configure notification icon
        script: |
          cp -R android-assets/ic_notification/* android/app/src/main/res/
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="nooryaa_notification_color">#5D2A8C</color></resources>' > android/app/src/main/res/values/nooryaa_colors.xml
          perl -0pi -e 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="\@drawable/ic_notification" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="\@color/nooryaa_notification_color" />\n  </application>|' android/app/src/main/AndroidManifest.xml
      - name: Configure notification permission
        script: |
          perl -0pi -e 's|(<manifest[^>]*>)|$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml || { echo "Permission notifications non appliquee"; exit 1; }
      - name: Set app version (1.0.4)

        script: |
          perl -pi -e 's/versionCode\s+\d+/versionCode 5/; s/versionName\s+"[^"]*"/versionName "1.0.4"/' android/app/build.gradle

          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 5' android/app/build.gradle || { echo "Version non appliquee"; exit 1; }

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

  # Version Google Play (AAB signé, à téléverser dans Play Console)
  nooryaa-android-release:
    name: Nooryaa Android (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - nooryaa_keystore
      node: v22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          # Capacitor 6 imposé : le module de connexion Google native
          # (@codetrix-studio/capacitor-google-auth) n'est compatible qu'avec v6.
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6 @capacitor/app@6 @codetrix-studio/capacitor-google-auth

      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
      - name: Configure Firebase (notifications push)
        script: |
          cp google-services.json android/app/google-services.json
          sed -i '' 's|classpath "com.android.tools.build:gradle:.*"|&\n        classpath "com.google.gms:google-services:4.5.0"|' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Configure app launcher icon
        script: |
          node scripts/configure-android-icon.mjs
      - name: Configure notification icon
        script: |
          cp -R android-assets/ic_notification/* android/app/src/main/res/
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="nooryaa_notification_color">#5D2A8C</color></resources>' > android/app/src/main/res/values/nooryaa_colors.xml
          perl -0pi -e 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="\@drawable/ic_notification" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="\@color/nooryaa_notification_color" />\n  </application>|' android/app/src/main/AndroidManifest.xml
      - name: Configure notification permission
        script: |
          perl -0pi -e 's|(<manifest[^>]*>)|$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml || { echo "Permission notifications non appliquee"; exit 1; }

      - name: Set app version (1.0.4)
        script: |
          perl -pi -e 's/versionCode\s+\d+/versionCode 5/; s/versionName\s+"[^"]*"/versionName "1.0.4"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 5' android/app/build.gradle || { echo "Version non appliquee"; exit 1; }
      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
      - name: Collect ProGuard mapping (if present)
        script: |
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp android/app/build/outputs/mapping/release/mapping.txt mapping.txt
            echo "mapping.txt collecte"
          else
            echo "Aucun mapping.txt (code non obfuscé)"
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - mapping.txt
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

  # Vérification iPhone : compile l'application pour le simulateur, sans
  # signature. Cette chaîne fonctionne sans compte Apple : elle sert à
  # valider la construction (dépendances, icône, notifications, version)
  # dès maintenant, en attendant la validation du compte développeur.
  nooryaa-ios-check:
    name: Nooryaa iPhone (vérification)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22.12.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/ios @capacitor/push-notifications @capacitor/app
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Configure app launcher icon
        script: |
          node scripts/configure-ios-icon.mjs
      - name: Configure push notifications
        script: |
          node scripts/configure-ios-push.mjs
      - name: Set app version (1.0.0)
        script: |
          node scripts/set-ios-version.mjs 1.0.0 1
      - name: Build for simulator (unsigned)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

  # Version App Store : archive signée à téléverser dans App Store Connect.
  # ⚠️ Exige le compte Apple validé, puis dans Codemagic : l'intégration
  # App Store Connect (clé API) et un certificat de distribution. Sans cela,
  # l'archive échoue à l'étape de signature.
  nooryaa-ios-release:
    name: Nooryaa iPhone (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: v22.12.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nooryaa.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/ios @capacitor/push-notifications @capacitor/app
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Configure app launcher icon
        script: |
          node scripts/configure-ios-icon.mjs
      - name: Configure push notifications
        script: |
          node scripts/configure-ios-push.mjs
      - name: Set app version (1.0.0)
        script: |
          node scripts/set-ios-version.mjs 1.0.0 1
      - name: Check Apple signing setup
        script: |
          if [ -z "$CM_APP_STORE_CONNECT_API_KEY_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
            echo "Aucune intégration App Store Connect détectée dans Codemagic."
            echo "Ajoutez la clé API App Store Connect (ou un certificat de distribution)"
            echo "dans l'onglet Integrations du projet, puis relancez ce workflow."
            exit 1
          fi
      - name: Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -allowProvisioningUpdates archive
      - name: Export App Store package
        script: |
          cd ios/App
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true
