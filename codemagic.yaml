  # Vérification iPhone : compile l'application pour le simulateur, sans
  # signature. Cette chaîne fonctionne sans compte Apple : elle sert à
  # valider la construction (dépendances, icône, notifications, version)
  # dès maintenant, en attendant la validation du compte développeur.
  nooryaa-ios-check:
    name: Nooryaa iPhone (vérification)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22.12.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --save @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/push-notifications@6 @capacitor/app@6 @capacitor/app-launcher@6
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Configure app launcher icon
        script: |
          node scripts/configure-ios-icon.mjs
      - name: Configure push notifications
        script: |
          node scripts/configure-ios-push.mjs
      - name: Configure deep links
        script: |
          node scripts/configure-ios-deeplinks.mjs
      - name: Configure screen security
        script: |
          node scripts/configure-ios-screen-security.mjs
      - name: Set app version (1.0.1)
        script: |
          node scripts/set-ios-version.mjs 1.0.1 20
      - name: Build for simulator (unsigned)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

  # Version App Store : archive signée à téléverser dans App Store Connect.
  # ⚠️ Exige le compte Apple validé, puis dans Codemagic : l'intégration
  # App Store Connect (clé API) et un certificat de distribution. Sans cela,
  # l'archive échoue à l'étape de signature.
  nooryaa-ios-release:
    name: Nooryaa iPhone (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Nooryaa
    environment:
      node: v22.12.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nooryaa.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --save @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/push-notifications@6 @capacitor/app@6 @capacitor/app-launcher@6
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Configure app launcher icon
        script: |
          node scripts/configure-ios-icon.mjs
      - name: Configure push notifications
        script: |
          node scripts/configure-ios-push.mjs
      - name: Configure deep links
        script: |
          node scripts/configure-ios-deeplinks.mjs
      - name: Configure screen security
        script: |
          node scripts/configure-ios-screen-security.mjs
      - name: Set app version (1.0.1)
        script: |
          node scripts/set-ios-version.mjs 1.0.1 20
      - name: Set up code signing
        # Récupère les profils via l'intégration App Store Connect et inscrit
        # l'équipe Apple dans le projet Xcode (régénéré à chaque build).
        script: |
          xcode-project use-profiles
      - name: Check Apple signing setup
        script: |
          if [ -z "$CM_APP_STORE_CONNECT_API_KEY_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -z "$CM_CERTIFICATE_ID" ]; then
            echo "Aucune intégration Apple détectée dans Codemagic (clé API App Store Connect ou connexion Apple Developer)."
            echo "Connectez votre compte Apple dans Codemagic : Teams -> Integrations -> Apple,"
            echo "ou via une clé API App Store Connect, puis relancez ce workflow."
            echo "Le build continuera : la signature peut aussi venir de la connexion Apple Developer."
          else
            echo "Intégration Apple détectée dans Codemagic."
          fi
      - name: Build signed IPA
        # Archive + export avec les profils installés par "use-profiles"
        # (xcodebuild -exportArchive seul ne trouve ni compte ni profil).
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Envoi automatique du build vers App Store Connect (TestFlight)
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true
