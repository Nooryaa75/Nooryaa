# Configuration Codemagic — builds Android de Nooryaa
# Le projet Android est généré à chaque build : aucun dossier à committer.

workflows:
  # Version de test (APK à installer directement sur un téléphone)
  nooryaa-android:
    name: Nooryaa Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - nooryaa_keystore
      node: v22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          # Capacitor 6 imposé : le module de connexion Google native
          # (@codetrix-studio/capacitor-google-auth) n'est compatible qu'avec v6.
          npm install --save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6 @capacitor/app@6 @capacitor/app-launcher@6 @codetrix-studio/capacitor-google-auth@3.3.6

      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
          # Les modules du téléphone doivent être intégrés, sinon les notifications ne marchent pas.
          for m in capacitor-push-notifications capacitor-app capacitor-app-launcher capacitor-google-auth; do grep -q "$m" android/capacitor.settings.gradle || { echo "Module $m absent"; exit 1; }; done
      - name: Configure Android SDK (minimum 24, cible 36)
        script: |
          perl -pi -e 's/minSdkVersion\s*=\s*\d+/minSdkVersion = 24/; s/compileSdkVersion\s*=\s*\d+/compileSdkVersion = 36/; s/targetSdkVersion\s*=\s*\d+/targetSdkVersion = 36/' android/variables.gradle
          grep -Eq 'minSdkVersion\s*=\s*24\b' android/variables.gradle || { echo "SDK minimum 24 non applique"; exit 1; }
          grep -Eq 'compileSdkVersion\s*=\s*36\b' android/variables.gradle || { echo "SDK de compilation 36 non applique"; exit 1; }
          grep -Eq 'targetSdkVersion\s*=\s*36\b' android/variables.gradle || { echo "SDK cible 36 non applique"; exit 1; }
          grep -Eq 'minSdkVersion[[:space:]]+rootProject.ext.minSdkVersion' android/app/build.gradle || { echo "SDK minimum de l application non relie aux variables"; exit 1; }
      - name: Configure Firebase (notifications push)
        script: |
          cp google-services.json android/app/google-services.json
          # Preuve dans le journal : fichier Google bien place + empreintes incluses
          ls -l android/app/google-services.json
          grep -q '"com.nooryaa.app"' android/app/google-services.json || { echo "google-services.json absent ou mauvais package"; exit 1; }
          echo "Empreintes SHA-1 presentes dans google-services.json :"; grep certificate_hash android/app/google-services.json
          perl -pi -e 's|classpath "com.android.tools.build:gradle:.*"|$&\n        classpath "com.google.gms:google-services:4.5.0"|' android/build.gradle
          grep -q 'com.google.gms:google-services' android/build.gradle || { echo "Plugin Firebase non applique"; exit 1; }
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Configure Google sign-in (server_client_id)
        script: |
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="server_client_id">516335009400-f78hfgk941t6bjmis93ne0mn6863dci9.apps.googleusercontent.com</string></resources>' > android/app/src/main/res/values/nooryaa_google.xml
      - name: Configure app launcher icon
        script: |
          node scripts/configure-android-icon.mjs
      - name: Configure notification icon
        script: |
          cp -R android-assets/ic_notification/* android/app/src/main/res/
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="nooryaa_notification_color">#5D2A8C</color></resources>' > android/app/src/main/res/values/nooryaa_colors.xml
          perl -0pi -e 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="\@drawable/ic_notification" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="\@color/nooryaa_notification_color" />\n  </application>|' android/app/src/main/AndroidManifest.xml
      - name: Configure notification permission
        script: |
          perl -0pi -e 's|(<manifest[^>]*>)|$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />|' android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml || { echo "Permission notifications non appliquee"; exit 1; }
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || { echo "Permission camera non appliquee"; exit 1; }
      - name: Configure deep links
        script: |
          node scripts/configure-android-deeplinks.mjs
      - name: Protect screenshots and screen recording
        script: |
          node scripts/configure-android-screen-security.mjs
      - name: Set app version (1.0.17)
        script: |
          perl -pi -e 's/versionCode\s+\d+/versionCode 20/; s/versionName\s+"[^"]*"/versionName "1.0.17"/' android/app/build.gradle

          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 20' android/app/build.gradle || { echo "Version non appliquee"; exit 1; }
          grep -q 'versionName "1.0.17"' android/app/build.gradle || { echo "Version non appliquee"; exit 1; }
      - name: Show signing fingerprint (SHA-1 a comparer avec Google)
        script: |
          echo "=== SHA-1 de la cle qui signe cette appli ==="
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" | grep -E "SHA1|SHA-1"



      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          # Signé avec la vraie clé nooryaa_keystore : son SHA-1 est celui
          # enregistré chez Google, sinon la connexion Google échoue (code 10).
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - karim@nooryaa.com
        notify:
          success: true
          failure: true

